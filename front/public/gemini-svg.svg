<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <defs>
    <!-- Gradiente atualizado para a paleta Verde Menta/Esmeralda -->
    <linearGradient id="flowGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" /> <!-- Menta Claro -->
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" /> <!-- Esmeralda -->
    </linearGradient>
  </defs>

  <!-- Fundo Dark da Interface -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="#0b0f12" />

  <!-- Linha Contínua: Dados -> Som -->
  <path d="M 15 50 
           L 30 50 
           C 35 40, 40 60, 45 50 
           S 50 40, 55 50 
           L 70 50 
           C 75 40, 80 60, 85 50" 
        fill="none" stroke="url(#flowGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Nós Ativos da Rádio (Atualizados para as novas cores) -->
  <circle cx="15" cy="50" r="4" fill="#34d399" /> <!-- Início: Menta -->
  <circle cx="30" cy="50" r="4" fill="#34d399" /> 
  <circle cx="70" cy="50" r="4" fill="#10b981" /> 
  <circle cx="85" cy="50" r="5" fill="#10b981" /> <!-- Fim: Esmeralda -->

  <!-- Ponto de Transmissão Online (Mantido branco para contraste) -->
  <circle cx="50" cy="50" r="1.5" fill="white" />
  <circle cx="50" cy="50" r="15" fill="none" stroke="white" stroke-width="1" stroke-opacity="0.3">
    <animate attributeName="r" from="2" to="20" dur="2s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" from="0.5" to="0" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
